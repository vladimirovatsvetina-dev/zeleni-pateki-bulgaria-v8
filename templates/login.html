<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход - Зелени пътеки България</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    {% include "_navigation.html" %}
    <main class="section container narrow">
        <h1>Вход</h1>
        {% if error %}<p class="result error" role="alert">{{ error }}</p>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Потребителско име
                <input name="username" autocomplete="username" required>
            </label>
            <label>Парола
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Вход</button>
        </form>
        <p>Нямате акаунт? <a href="{{ url_for('register_public') }}">Регистрация като турист</a></p>
        <p>Планински водач? <a href="{{ url_for('register_operator') }}">Кандидатствайте като оператор</a></p>
    </main>
</body>
</html>
