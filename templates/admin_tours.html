<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>Направени резервации - Зелени пътеки България</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    {% include "_navigation.html" %}
    <main>
        <h1>Управление на турове</h1>
        <p><a href="{{ url_for('tour_create') }}">Добави нов тур</a></p>
        <table>
            <thead>
                <tr><th>ID</th><th>Тур</th><th>Цена</th><th>Активен</th><th>Действия</th></tr>
            </thead>
            <tbody>
                {% for tour in tours %}
                <tr>
                    <td>{{ tour["id"] }}</td>
                    <td>{{ tour["name"] }}</td>
                    <td>{{ tour["price"] }} лв.</td>
                    <td>{{ "Да" if tour["is_active"] else "Не" }}</td>
                    <td>
                        <a href="{{ url_for('tour_edit', tour_id=tour['id']) }}">Редактирай</a>
                        <form action="{{ url_for('tour_toggle_is_active', tour_id=tour['id']) }}" method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit">{{ "Деактивирай" if tour["is_active"] else "Активирай" }}</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="5">Няма добавени турове.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </main>

</body>

</html>
